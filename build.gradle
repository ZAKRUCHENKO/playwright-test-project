plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.1'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'com.microsoft.playwright:playwright:1.52.0'

    // JUnit 5: BOM задает общую версию для всех junit-артефактов
    testImplementation platform('org.junit:junit-bom:5.10.2')
    // Агрегатор API + params (параметризованные тесты)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Движок запуска тестов
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    // Интеграция платформы JUnit с системой сборки (обязателен для Gradle 9+)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Jackson для парсинга JSON в API-тестах (Gradle-эквивалент зависимости из pom.xml на mvnrepository.com)
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
    systemProperty 'allure.results.directory', 'build/allure-results'
}

// Allure: allure.version — версия генератора отчёта (2.x = allure-commandline);
// adapter.allureJavaVersion — версия allure-java адаптера, который пишет результаты тестов
allure {
    version = '2.46.2'
    adapter {
        allureJavaVersion = '2.29.1'
        aspectjWeaver = true
    }
}

// Открыть Trace Viewer: ./gradlew showTrace [-Ptrace=trace/dynamic-loading-trace.zip]
def traceFile = project.findProperty('trace') ?: 'trace/trace-success.zip'
tasks.register('showTrace', JavaExec) {
    group = 'playwright'
    description = 'Открывает Playwright Trace Viewer для сохранённого трейса'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['show-trace', traceFile]
}
